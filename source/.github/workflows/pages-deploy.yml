name: Deploy Proof Desk Next.js export

on:
  push:
    branches: [main]
    paths:
      - proof-desk-github-pages.zip
      - .github/workflows/pages-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract the prebuilt Next.js static export
        run: |
          unzip -tq proof-desk-github-pages.zip
          unzip -q proof-desk-github-pages.zip -d _site
          test -s _site/index.html
          test -d _site/_next/static

      - name: Upload only the exported site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
